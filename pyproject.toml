[project]
name = "public-sector-copilot"
version = "0.1.0"
description = "Integration demo: an agent that triages public tenders and answers BOE questions with citations, built from four independent open-source components."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "jorgitobg" }]
dependencies = [
  "agent-harness @ git+https://github.com/jorgitobg/agent-harness@bef0292be79f4f3337174aa035e397539e1994b6",
  "llm-gateway @ git+https://github.com/jorgitobg/llm-gateway@2f88723852557fa4afac857181410590c09361ff",
  "mcp-toolbox @ git+https://github.com/jorgitobg/mcp-toolbox@7ce166ee117eec3d5ae05b87f6db7975e3a6945a",
  "sovereign-rag @ git+https://github.com/jorgitobg/sovereign-rag@a5ca64d56afe8deeadbbbf63e142aceeca826882",
  "mcp>=1.30",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1.380"]

[project.scripts]
public-sector-copilot = "public_sector_copilot.demo:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/public_sector_copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "BLE"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
addopts = "-q --cov=public_sector_copilot --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
asyncio_mode = "auto"
